pre-commit:
  commands:
    shell-fast-check:
      stage_fixed: true
      run: ./bin/executable_dotctl lint-staged-shell
    python-quality:
      glob: "*.py"
      stage_fixed: true
      run: ruff format {staged_files}
    lua-format:
      glob: "*.lua"
      stage_fixed: true
      run: stylua {staged_files}
    ai-docs-format:
      glob: "dot_{codex,claude}/skills/**/*.md"
      stage_fixed: true
      run: node scripts/ai-docs/cli.mjs fmt {staged_files}

post-merge:
  commands:
    chezmoi-apply:
      run: chezmoi apply --force < /dev/null
