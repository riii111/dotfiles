window_logo_scale 7

# Herdr v0.8.0 official logo (Apache-2.0):
# https://github.com/ogulcancelik/herdr/blob/v0.8.0/assets/logo.png
action_alias herdr_logo_on remote_control set-window-logo --position top-right --alpha 0.30 ~/.config/kitty/herdr-logo.png
action_alias herdr_logo_off remote_control set-window-logo none

# cmdlineは起動時のshellを指すため、Herdrが外側へ設定するtitleで判定する
map --new-mode herdr --on-unknown passthrough --timeout 0 --when-focus-on title:^herdr ctrl+;
map --when-focus-on title:^herdr ctrl+; combine : herdr_logo_on : push_keyboard_mode herdr

map --new-mode herdr-copy --mode herdr --on-unknown passthrough --timeout 0 v
map --new-mode herdr-selection --mode herdr --on-unknown passthrough --timeout 0 space
map --new-mode herdr-resize --mode herdr --on-unknown passthrough --timeout 0 r

map --mode herdr esc combine : herdr_logo_off : pop_keyboard_mode
map --mode herdr ctrl+; combine : herdr_logo_off : pop_keyboard_mode

map --mode herdr h combine : send_key ctrl+; : send_key h
map --mode herdr j combine : send_key ctrl+; : send_key j
map --mode herdr k combine : send_key ctrl+; : send_key k
map --mode herdr l combine : send_key ctrl+; : send_key l

map --mode herdr shift+h combine : send_key ctrl+; : send_key r : send_key h : push_keyboard_mode herdr-resize
map --mode herdr shift+j combine : send_key ctrl+; : send_key r : send_key j : push_keyboard_mode herdr-resize
map --mode herdr shift+k combine : send_key ctrl+; : send_key r : send_key k : push_keyboard_mode herdr-resize
map --mode herdr shift+l combine : send_key ctrl+; : send_key r : send_key l : push_keyboard_mode herdr-resize

map --mode herdr [ combine : send_key ctrl+; : send_key [
map --mode herdr ] combine : send_key ctrl+; : send_key ]
map --mode herdr shift+[ combine : send_key ctrl+; : send_key shift+[
map --mode herdr shift+] combine : send_key ctrl+; : send_key shift+]
map --mode herdr , combine : send_key ctrl+; : send_key ,
map --mode herdr . combine : send_key ctrl+; : send_key .

map --mode herdr p combine : send_key ctrl+; : send_key p
map --mode herdr alt+p combine : send_key ctrl+; : send_key alt+p : herdr_logo_off : pop_keyboard_mode
map --mode herdr t combine : send_key ctrl+; : send_key t : herdr_logo_off : pop_keyboard_mode
map --mode herdr alt+t combine : send_key ctrl+; : send_key alt+t : herdr_logo_off : pop_keyboard_mode
map --mode herdr v combine : send_key ctrl+; : send_key v : push_keyboard_mode herdr-copy
map --mode herdr shift+v combine : send_key ctrl+; : send_key shift+v : herdr_logo_off : pop_keyboard_mode
map --mode herdr d combine : send_key ctrl+; : send_key d
map --mode herdr shift+d combine : send_key ctrl+; : send_key shift+d
map --mode herdr shift+p combine : send_key ctrl+; : send_key shift+p : herdr_logo_off : pop_keyboard_mode
map --mode herdr shift+t combine : send_key ctrl+; : send_key shift+t : herdr_logo_off : pop_keyboard_mode
map --mode herdr z combine : send_key ctrl+; : send_key z

map --mode herdr w combine : send_key ctrl+; : send_key w
map --mode herdr alt+w combine : send_key ctrl+; : send_key alt+w : herdr_logo_off : pop_keyboard_mode
map --mode herdr shift+w combine : send_key ctrl+; : send_key shift+w : herdr_logo_off : pop_keyboard_mode
map --mode herdr space combine : send_key ctrl+; : send_key space : push_keyboard_mode herdr-selection
map --mode herdr g combine : send_key ctrl+; : send_key g : push_keyboard_mode herdr-selection
map --mode herdr ctrl+g combine : send_key ctrl+; : send_key ctrl+g : herdr_logo_off : pop_keyboard_mode
map --mode herdr shift+/ combine : send_key ctrl+; : send_key shift+/ : herdr_logo_off : pop_keyboard_mode
map --mode herdr s combine : send_key ctrl+; : send_key s : herdr_logo_off : pop_keyboard_mode
map --mode herdr ctrl+s combine : send_key ctrl+; : send_key ctrl+s : herdr_logo_off : pop_keyboard_mode
map --mode herdr r combine : send_key ctrl+; : send_key r : push_keyboard_mode herdr-resize
map --mode herdr shift+r combine : send_key ctrl+; : send_key shift+r
map --mode herdr shift+o combine : send_key ctrl+; : send_key shift+o : herdr_logo_off : pop_keyboard_mode

map --mode herdr 1 combine : send_key ctrl+; : send_key shift+1
map --mode herdr 2 combine : send_key ctrl+; : send_key shift+2
map --mode herdr 3 combine : send_key ctrl+; : send_key shift+3
map --mode herdr 4 combine : send_key ctrl+; : send_key shift+4
map --mode herdr 5 combine : send_key ctrl+; : send_key shift+5
map --mode herdr 6 combine : send_key ctrl+; : send_key shift+6
map --mode herdr 7 combine : send_key ctrl+; : send_key shift+7
map --mode herdr 8 combine : send_key ctrl+; : send_key shift+8
map --mode herdr 9 combine : send_key ctrl+; : send_key shift+9

map --mode herdr-copy esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-copy q combine : send_key q : pop_keyboard_mode
map --mode herdr-copy y combine : send_key y : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-copy shift+y combine : send_key shift+y : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-copy ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode

map --mode herdr-selection esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-selection q combine : send_key q : pop_keyboard_mode
map --mode herdr-selection enter combine : send_key enter : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-selection ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode

map --mode herdr-resize esc combine : send_key esc : pop_keyboard_mode
map --mode herdr-resize enter combine : send_key enter : pop_keyboard_mode
map --mode herdr-resize r combine : send_key r : pop_keyboard_mode
map --mode herdr-resize ctrl+; combine : send_key esc : herdr_logo_off : pop_keyboard_mode : pop_keyboard_mode
map --mode herdr-resize h send_key h
map --mode herdr-resize j send_key j
map --mode herdr-resize k send_key k
map --mode herdr-resize l send_key l
map --mode herdr-resize left send_key left
map --mode herdr-resize down send_key down
map --mode herdr-resize up send_key up
map --mode herdr-resize right send_key right
