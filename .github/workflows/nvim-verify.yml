name: Neovim Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - private_dot_config/nvim/**
      - scripts/nvim-plugins.py
      - tests/nvim/**
      - .github/workflows/nvim-verify.yml
      - .github/workflows/update-nvim-plugins.yml
      - flake.lock
      - flake.nix
  workflow_dispatch:
    inputs:
      update:
        description: Verify a plugin update without creating a pull request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Verify plugins with temporary XDG directories
        env:
          MODE: ${{ inputs.update && 'update' || 'check' }}
        run: >-
          nix shell --inputs-from .
          nixpkgs#neovim nixpkgs#tree-sitter nixpkgs#lua-language-server
          nixpkgs#go_1_27 nixpkgs#ripgrep
          --command python3 scripts/nvim-plugins.py "$MODE"
