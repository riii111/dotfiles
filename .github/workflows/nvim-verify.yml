name: Neovim Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - private_dot_config/nvim/**
      - scripts/nvim-plugins.py
      - tests/nvim/**
      - .github/workflows/nvim-verify.yml
      - .github/workflows/update-nvim-plugins.yml
      - flake.lock
      - flake.nix
  workflow_dispatch:
    inputs:
      update:
        description: Verify a plugin update without creating a pull request
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fetch the official installer to a file with HTTP failure checks and retries.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: accept-flake-config = true

      - name: Verify plugins with temporary XDG directories
        env:
          MODE: ${{ inputs.update && 'update' || 'check' }}
        run: >-
          nix shell --inputs-from .
          nixpkgs#neovim nixpkgs#tree-sitter nixpkgs#lua-language-server
          nixpkgs#go_1_27 nixpkgs#ripgrep
          --command python3 scripts/nvim-plugins.py "$MODE"
