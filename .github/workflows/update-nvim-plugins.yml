name: Update Neovim plugins

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

concurrency:
  group: update-nvim-plugins
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      base-sha: ${{ steps.result.outputs.base-sha }}
      lockfile: ${{ steps.result.outputs.lockfile }}
      report: ${{ steps.result.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update and verify with temporary XDG directories
        run: >-
          nix shell --inputs-from .
          nixpkgs#neovim nixpkgs#tree-sitter nixpkgs#lua-language-server
          nixpkgs#go nixpkgs#ripgrep
          --command python3 scripts/nvim-plugins.py update --report "$RUNNER_TEMP/nvim-report.json"

      - name: Export verified lockfile
        id: result
        run: |
          {
            echo "base-sha=$(git rev-parse HEAD)"
            echo "lockfile=$(jq -Rs . private_dot_config/nvim/lazy-lock.json)"
            echo "report=$(jq -c . "$RUNNER_TEMP/nvim-report.json")"
          } >> "$GITHUB_OUTPUT"

  pull-request:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Import verified lockfile
        env:
          VERIFIED_BASE: ${{ needs.update.outputs.base-sha }}
          VERIFIED_LOCKFILE: ${{ needs.update.outputs.lockfile }}
          PLUGIN_REPORT: ${{ needs.update.outputs.report }}
        run: |
          [[ "$VERIFIED_BASE" =~ ^[0-9a-f]{40}$ ]]
          if ! git diff --quiet "$VERIFIED_BASE" HEAD -- \
            private_dot_config/nvim flake.nix flake.lock 'scripts/nvim*' tests/nvim \
            .github/workflows/update-nvim-plugins.yml; then
            echo 'Neovim update inputs changed during verification. Re-run this workflow.' >&2
            exit 1
          fi
          cp private_dot_config/nvim/lazy-lock.json "$RUNNER_TEMP/nvim-lock-before.json"
          printf '%s\n' "$VERIFIED_LOCKFILE" | jq -je '
            . as $contents | fromjson |
            if type == "object" and length > 0 and
               all(to_entries[];
                   (.key | test("\\A[A-Za-z0-9_.-]+\\z")) and
                   (.value | keys == ["branch", "commit"]) and
                   (.value.branch | test("\\A[A-Za-z0-9_./-]+\\z")) and
                   (.value.commit | test("\\A[0-9a-f]{40}\\z")))
            then $contents else error("Invalid lockfile") end
          ' > private_dot_config/nvim/lazy-lock.json
          printf '%s\n' "$PLUGIN_REPORT" > "$RUNNER_TEMP/nvim-report.json"

      - name: Build pull request body from validated data
        run: |
          python3 scripts/nvim_plugin_report.py \
            "$RUNNER_TEMP/nvim-lock-before.json" private_dot_config/nvim/lazy-lock.json \
            "$RUNNER_TEMP/nvim-report.json" "$RUNNER_TEMP/nvim-pr-body.md"
          cat "$RUNNER_TEMP/nvim-pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-nvim-plugins
          add-paths: private_dot_config/nvim/lazy-lock.json
          commit-message: "chore(nvim): update plugins"
          title: "chore(nvim): update plugins"
          draft: always-true
          delete-branch: true
          labels: dependencies
          body-path: ${{ runner.temp }}/nvim-pr-body.md

  notify-failure:
    needs: [update, pull-request]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = 'Neovim plugin update failed';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Neovimプラグインの更新処理が失敗しました。\n\n[実行ログ](${url})を確認し、修正後にworkflowを再実行してください。`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
