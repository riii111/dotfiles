name: Main Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/ai-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run links
      - run: npm run fmt -- --all --check
      - run: npm run lint

  test:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Fetch only the locally built paths on demand; restoring the whole store took ~7 minutes.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Evaluate Go and both Darwin configurations
        run: |
          nix eval --json .#lib.toolVersions.aarch64-darwin.go \
            --apply 'v: builtins.compareVersions v "1.27.3" >= 0' | grep -qx true
          nix eval --raw .#darwinConfigurations.personal.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.work.config.system.build.toplevel.drvPath

      - name: Verify patched uv
        shell: bash
        run: |
          nix run --print-build-logs .#uv -- --version | tee /tmp/uv-version
          grep -Eq '^uv 0\.13\.5( \(.*\))?$' /tmp/uv-version

      - name: Verify patched Python and ensurepip
        run: |
          nix run --print-build-logs .#python3 -- -I -c 'import ensurepip; assert ensurepip.version() == "26.2.2"'

      - name: Run repo verification
        run: |
          nix develop .#ci -c ./bin/executable_dotctl test
          nix develop .#ci -c go -C dot_claude/statusline test ./...
