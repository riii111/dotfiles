name: Main Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nix: ${{ steps.paths.outputs.nix }}
      dot_tools: ${{ steps.paths.outputs.dot_tools }}
      repo: ${{ steps.paths.outputs.repo }}
      hooks: ${{ steps.paths.outputs.hooks }}
      ondemand: ${{ steps.paths.outputs.ondemand }}
      ondemand_darwin: ${{ steps.paths.outputs.ondemand_darwin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test path selection
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python3 scripts/ci/selection.py --before "$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/selection.py --base "$BASE_SHA" >> "$GITHUB_OUTPUT"
          fi
      # The full repo suite already includes these tests.
      - name: Verify cloud setup for operational Markdown
        if: steps.paths.outputs.cloud == 'true' && steps.paths.outputs.repo != 'true'
        run: python3 -m unittest discover -s tests -p "test_cloud_setup.py"

  ai-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/ai-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run links
      - run: npm run fmt -- --all --check
      - run: npm run lint

  linux:
    needs: select
    if: needs.select.outputs.nix == 'true' || needs.select.outputs.dot_tools == 'true' || needs.select.outputs.repo == 'true' || needs.select.outputs.ondemand != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No store cache: restoring a cached store cost more than it saved.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # The Go floor guards the CVE-2026-111943 rebuild against a nixpkgs update.
      - name: Evaluate the Go version
        if: needs.select.outputs.nix == 'true'
        run: |
          nix eval --json .#lib.toolVersions.aarch64-darwin.go \
            --apply 'v: builtins.compareVersions v "1.27.3" >= 0' | grep -qx true
      - name: Build and test dot-tools
        if: needs.select.outputs.dot_tools == 'true'
        run: nix build --print-build-logs .#dot-tools
      - name: Run repo verification and agent-hooks integration
        if: needs.select.outputs.repo == 'true' && needs.select.outputs.hooks == 'true'
        run: nix develop .#ci -c nix shell .#dot-tools -c ./bin/executable_dotctl test
      - name: Run repo verification
        if: needs.select.outputs.repo == 'true' && needs.select.outputs.hooks != 'true'
        run: nix develop .#ci -c ./bin/executable_dotctl test --skip-agent-hooks
      - name: Run selected on-demand tests
        if: needs.select.outputs.ondemand != ''
        env:
          ONDEMAND: ${{ needs.select.outputs.ondemand }}
        run: |
          # shellcheck disable=SC2086 # One path per word.
          nix develop .#ci -c nix shell --inputs-from . nixpkgs#lefthook \
            -c ./bin/executable_dotctl test --ondemand $ONDEMAND

  # Only what must build, run or import aarch64-darwin derivations.
  darwin:
    needs: select
    if: needs.select.outputs.nix == 'true' || needs.select.outputs.ondemand_darwin != ''
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # The patched uninstaller source is imported from an aarch64-darwin build, so Linux cannot evaluate these.
      - name: Evaluate both Darwin configurations
        if: needs.select.outputs.nix == 'true'
        run: |
          nix eval --raw .#darwinConfigurations.personal.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.work.config.system.build.toplevel.drvPath
      - name: Verify patched Python and ensurepip
        if: needs.select.outputs.nix == 'true'
        run: |
          nix run --print-build-logs .#python3 -- -I -c 'import ensurepip; assert ensurepip.version() == "26.2.2"'
      - name: Build and test dot-tools with the Darwin toolchain
        if: needs.select.outputs.nix == 'true'
        run: nix build --print-build-logs .#dot-tools
      - name: Run selected Darwin on-demand tests
        if: needs.select.outputs.ondemand_darwin != ''
        env:
          ONDEMAND: ${{ needs.select.outputs.ondemand_darwin }}
        # The activation test evaluates the Darwin configurations offline, so fetch every input first.
        run: |
          nix flake archive > /dev/null
          # shellcheck disable=SC2086 # One path per word.
          nix develop .#ci -c ./bin/executable_dotctl test --ondemand $ONDEMAND

  # Keep the required status stable and fail if selection or selected work failed.
  test:
    needs: [select, linux, darwin]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          SELECT_RESULT: ${{ needs.select.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          DARWIN_RESULT: ${{ needs.darwin.result }}
          NIX: ${{ needs.select.outputs.nix }}
          DOT_TOOLS: ${{ needs.select.outputs.dot_tools }}
          REPO: ${{ needs.select.outputs.repo }}
          ONDEMAND: ${{ needs.select.outputs.ondemand }}
          ONDEMAND_DARWIN: ${{ needs.select.outputs.ondemand_darwin }}
        run: |
          [ "$SELECT_RESULT" = success ]
          expect() { if [ "$1" = true ]; then [ "$2" = success ]; else [ "$2" = skipped ]; fi; }
          linux=false
          if [ "$NIX" = true ] || [ "$DOT_TOOLS" = true ] || [ "$REPO" = true ] || [ -n "$ONDEMAND" ]; then
            linux=true
          fi
          darwin=false
          if [ "$NIX" = true ] || [ -n "$ONDEMAND_DARWIN" ]; then
            darwin=true
          fi
          expect "$linux" "$LINUX_RESULT"
          expect "$darwin" "$DARWIN_RESULT"
