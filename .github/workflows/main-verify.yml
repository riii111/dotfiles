name: Main Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  ai-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/ai-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run links
      - run: npm run fmt -- --all --check
      - run: npm run lint

  test:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Evaluate Go and both Darwin configurations
        run: |
          nix eval --json .#lib.toolVersions.aarch64-darwin.go \
            --apply 'v: builtins.compareVersions v "1.27.3" >= 0' | grep -qx true
          nix eval --raw .#darwinConfigurations.personal.config.system.build.toplevel.drvPath
          nix eval --raw .#darwinConfigurations.work.config.system.build.toplevel.drvPath

      - name: Verify patched uv
        shell: bash
        run: |
          nix run --print-build-logs .#uv -- --version | tee /tmp/uv-version
          grep -Eq '^uv 0\.13\.5( \(.*\))?$' /tmp/uv-version

      - name: Verify patched Python and ensurepip
        run: |
          nix run --print-build-logs .#python3 -- -I -c 'import ensurepip; assert ensurepip.version() == "26.2.2"'

      - name: Run repo verification
        run: |
          nix develop .#ci -c ./bin/executable_dotctl test
          nix develop .#ci -c go -C dot_claude/statusline test ./...
